# dsh-watch-kit-plugin —— profile bundle layer
#
# 安装后默认：10s 轮询，运行时状态在用户级 <dshHome>（默认 ~/.dsh）下：
#   配置 <dshHome>/watch/watches.json，DB <dshHome>/watch/watch.db。
# 在 profile 的 cordis.patch.yml 里覆盖 watch 行 config（不要用 insert：bundle 已插入该行）：
#
#   - id: watch
#     config:
#       pollIntervalMs: 10000
#       configFile: /abs/path/watches.json
#       dbFile: /abs/path/watch.db
#       limits:                 # 全部可选；下面是默认值
#         checker:
#           maxStdoutBytes: 65536
#           maxStderrBytes: 8192
#           maxMessageBytes: 8192
#           maxErrorBytes: 2048
#         message:
#           maxItems: 20
#           maxBytes: 16384          # 实际渲染上限 = 配置 + 4096B（自留预算）
#         scheduler:
#           maxConcurrentChecks: 4
#           runRetentionDays: 7
#           deliveryTimeoutMs: 30000   # 单个 target 投递超时（1000–600000）
- insert:
    - id: watch
      name: dsh-watch-kit-plugin
      config:
        pollIntervalMs: 10000
        configFile: ''
        dbFile: ''
