# dsh-watch-kit-plugin —— profile bundle layer
#
# 安装后插件行默认没有 watch 目录（specDirs 为空，插件只在日志里提示一次）。
# 在 profile 的 cordis.patch.yml 里覆盖本行，填入 specDirs：
#
#   - id: watch
#     name: dsh-watch-kit-plugin
#     config:
#       specDirs:
#         - /Users/you/workspace/plugins/watch/watches
#
# 注意：profile patch 的覆盖会整体替换 config，未写的键回落到 Config 默认值。
- insert:
    - id: watch
      name: dsh-watch-kit-plugin
      config:
        specDirs: []
