# dsh-watch-kit-plugin watch 配置（KEY=VALUE；# 开头为注释）
# Windows 上 /watch-add 会复制 check.ps1，并把 CHECK 指向它。

PURPOSE=
TRIGGER_MSG=
INTERVAL=60

# ── 可选（默认值如下） ────────────────────────────────────────────
# TIMEOUT=15          # 1 ≤ TIMEOUT ≤ INTERVAL/2
# FAILURE_MSG=        # 空 = 失败只留记录；非空 = 失败触发时给 agent 的指令
# CHECK=./check.ps1
# RUNNER=auto         # auto|bash|pwsh|powershell|python|node|direct
# 可选唤醒预算（默认关闭；对"持续有事件流"的场景如即时聊天，建议保持关闭）
# WAKE_BUDGET_CAPACITY=0
# WAKE_BUDGET_REFILL_SECONDS=600
# ──────────────────────────────────────────────────────────────

# 目标会话 id：由 /watch-add 写入，不要手改（改绑定需要 /watch-approve）
TARGETS=
