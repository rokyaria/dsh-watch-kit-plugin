# dsh-watch-kit-plugin demo：目录大小监控
#
# 用法：/watch-add demo-dir-size --purpose "目录超过阈值时提醒我"
# 然后将本目录的 check.sh 复制到 watches/demo-dir-size/ 并按需改 DIR / LIMIT_MB。
# TARGETS 由 /watch-add 自动写入，不要手改。

PURPOSE=目录大小超过阈值时提醒我
TRIGGER_MSG=目录超过阈值，请确认是否需要清理或提高阈值。
INTERVAL=30
TIMEOUT=15
CHECK=./check.sh
# Windows：CHECK=./check.ps1；一般由 /watch-add 的模板自动决定
# RUNNER=auto
